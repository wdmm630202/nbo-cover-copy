name: Publish website and app updates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nanbo-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:cover-core
      - run: node --test tests/live-native.test.mjs tests/live-save.test.mjs tests/live-layout.test.mjs tests/export-core.test.mjs tests/static-core-parity.test.mjs
      - run: python3 native/test_publish.py
      - run: python3 native/prepare.py --web-only
      - name: Build one release for browser and native apps
        run: |
          mkdir -p work/site
          cp -R docs/. work/site/
          python3 native/publish_updates.py native/Web work/site/app-updates
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
