<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store"><meta name="robots" content="noindex,nofollow">
<title>更新南铂制作台</title>
<style>body{margin:0;background:#f6f5f1;color:#202820;font:16px/1.7 system-ui,sans-serif}main{max-width:560px;margin:14vh auto;padding:28px}h1{font-size:24px}p{color:#5e6b63}button{border:0;border-radius:12px;padding:14px 24px;background:#ff254c;color:white;font:600 16px system-ui;cursor:pointer}</style>
</head>
<body><main><h1>更新手机导出</h1><p id="message" role="status">正在获取最新版。更新后请重新选择照片；已下载图片和保存的设置不受影响。</p><button id="retry" hidden>重新尝试更新</button></main>
<script>
// Deliberately outside the offline worker's resource list: old workers must let this recovery page reach the network.
const base = new URL('./', location.href);
const message = document.getElementById('message'), retry = document.getElementById('retry');
async function update() {
  retry.hidden = true;
  try {
    const response = await fetch(new URL('studio-release.json?check=' + Date.now(), base), {cache:'no-store'});
    if (!response.ok) throw new Error('请检查网络后重试。');
    const release = await response.json();
    if (release.family !== 'nanbo-studio' || typeof release.build !== 'string') throw new Error('未能确认新版本，请稍后重试。');
    message.textContent = '已获取新版，正在清理此制作台的旧程序缓存…';
    if ('serviceWorker' in navigator) {
      for (const registration of await navigator.serviceWorker.getRegistrations()) {
        if (registration.scope === base.href) await registration.unregister();
      }
    }
    if ('caches' in window) {
      for (const key of await caches.keys()) {
        if (!key.startsWith('nanbo-studio-')) continue;
        const cache = await caches.open(key);
        if (await cache.match(new URL('cover.html', base))) await caches.delete(key);
      }
    }
    const target = new URL('cover.html', base);
    target.searchParams.set('mode','makeover'); target.searchParams.set('updated',release.build);
    location.replace(target.href);
  } catch (error) {
    message.textContent = '更新未完成，请保持联网后重试。' + (/[\u3400-\u9fff]/.test(error.message || '') ? error.message : ''); retry.hidden = false;
  }
}
retry.addEventListener('click',update);
update();
</script></body></html>
