<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff2442" />
    <meta name="description" content="识别真实图片，结合公开趋势联想，生成固定7+8字封面、三平台正文和话题。" />
    <title>NBO 灵感封面｜图片转热门文案</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #faf9f7; }
      .loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; color: #202020; text-align: center; }
      .loading span { color: #8a8580; font-size: 13px; }
      .mark { width: 52px; height: 52px; margin-bottom: 8px; display: grid; place-items: center; color: white; background: #ff2442; border-radius: 16px; font: 800 30px/1 Georgia, serif; box-shadow: 0 10px 26px rgba(255,36,66,.24); }
      .viewport { width: 100%; height: 100%; position: relative; z-index: 1; overflow: hidden; }
      iframe { width: 100%; height: 100%; position: absolute; top: 0; left: 0; border: 0; background: #faf9f7; }
      .workspace-nav {
        width: min(1180px, calc(100% - 40px));
        height: 84px;
        padding: 0 4px;
        position: fixed;
        z-index: 5;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 20px;
        border-bottom: 1px solid rgba(232,226,220,.82);
        background: rgba(250,249,247,.94);
        box-shadow: 0 12px 26px rgba(43,36,31,.04);
        backdrop-filter: blur(18px);
      }
      .workspace-brand { display: flex; align-items: center; gap: 11px; }
      .workspace-brand > span:last-child { display: flex; flex-direction: column; gap: 2px; }
      .workspace-brand-mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: #ff2442; color: #fff; font: 800 23px/1 Georgia, serif; box-shadow: 0 8px 22px rgba(255,36,66,.22); }
      .workspace-brand strong { font-size: 14px; }
      .workspace-brand small { color: #9a938c; font-size: 9px; }
      .workspace-online { justify-self: end; padding: 9px 13px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #e9e3dd; border-radius: 999px; background: rgba(255,255,255,.8); color: #6e6761; font-size: 10px; white-space: nowrap; }
      .workspace-online i { width: 7px; height: 7px; border-radius: 50%; background: #26a26a; box-shadow: 0 0 0 4px rgba(38,162,106,.1); }
      .cover-entry {
        min-width: 126px;
        height: 48px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid rgba(255,255,255,.75);
        border-radius: 999px;
        background: rgba(28,28,28,.94);
        color: #fff;
        box-shadow: 0 12px 32px rgba(0,0,0,.2);
        font-size: 14px;
        font-weight: 750;
        white-space: nowrap;
        text-decoration: none;
        backdrop-filter: blur(14px);
      }
      .cover-entry span { padding: 4px 7px; border-radius: 999px; background: #ff2442; font-size: 9px; }
      @media (max-width: 640px) {
        .workspace-nav { width: 100%; height: 68px; padding: 0 10px; grid-template-columns: 1fr auto; }
        .workspace-brand small, .workspace-online { display: none; }
        .cover-entry { min-width: 112px; height: 43px; font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <header class="workspace-nav">
      <div class="workspace-brand">
        <span class="workspace-brand-mark">N</span>
        <span><strong>NBO 灵感封面</strong><small>真实识图 · 公开趋势 · 三平台文案</small></span>
      </div>
      <a
        class="cover-entry"
        href="./cover.html"
        target="nbo-cover-studio"
        aria-label="在独立标签页打开封面制作，保留当前文案结果"
      ><span id="coverEntryBadge">新服务</span>制作封面</a>
      <div class="workspace-online"><i></i>免费智能版在线</div>
    </header>
    <div class="loading" aria-hidden="true">
      <div class="mark">N</div>
      <strong>正在进入南铂智能文案</strong>
      <span>请稍候，功能正在加载</span>
    </div>
    <div class="viewport">
      <iframe
        src="https://script.google.com/macros/s/AKfycbwE3jYEnaSh75A-5ft6T-ChSvDnKrLFHvKi8fBvMEHhyRcBgieWcKsuN-3iuuzwQIQ_/exec?nbo_embed=1"
        title="NBO 灵感封面智能文案工具"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
    <script>
      (() => {
        const storageKey = "nbo-cover-copy-sync-v1";
        const channelName = "nbo-cover-copy-sync-channel-v1";
        const frame = document.querySelector("iframe");
        const badge = document.querySelector("#coverEntryBadge");
        const channel = "BroadcastChannel" in window
          ? new BroadcastChannel(channelName)
          : null;
        let imagePayload = null;

        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
          if (saved && saved.topText && saved.bottomText) badge.textContent = "可同步";
        } catch {}

        window.addEventListener("message", (event) => {
          let hostname = "";
          try {
            hostname = new URL(event.origin).hostname;
          } catch {
            return;
          }
          const trusted =
            hostname === "script.google.com" ||
            hostname === "script.googleusercontent.com" ||
            hostname.endsWith(".script.googleusercontent.com");
          if (!trusted || event.source !== frame.contentWindow) return;

          if (event.data?.type === "NBO_COVER_IMAGE_READY") {
            const source = event.data.payload || {};
            if (
              typeof source.dataUrl !== "string" ||
              !/^data:image\/(?:jpeg|png|webp);base64,/i.test(source.dataUrl) ||
              source.dataUrl.length > 48000000
            ) return;
            imagePayload = {
              dataUrl: source.dataUrl,
              fileName: typeof source.fileName === "string" && source.fileName.trim()
                ? source.fileName.trim().slice(0, 160)
                : "文案页封面照片",
              updatedAt: Number(source.updatedAt) || Date.now(),
            };
            badge.textContent = "可同步";
            channel?.postMessage({ type: "NBO_COVER_IMAGE_READY", payload: imagePayload });
            return;
          }

          if (event.data?.type !== "NBO_COVER_COPY_SELECTED") return;

          const source = event.data.payload || {};
          const payload = {
            version: 1,
            topText: typeof source.topText === "string" ? source.topText.trim().slice(0, 18) : "",
            bottomText: typeof source.bottomText === "string" ? source.bottomText.trim().slice(0, 18) : "",
            platform: ["小红书", "抖音", "视频号"].includes(source.platform) ? source.platform : "小红书",
            selectionIndex: Math.max(0, Math.min(2, Number(source.selectionIndex) || 0)),
            updatedAt: Number(source.updatedAt) || Date.now(),
          };
          if (!payload.topText || !payload.bottomText) return;

          try {
            localStorage.setItem(storageKey, JSON.stringify(payload));
            badge.textContent = "可同步";
            channel?.postMessage(payload);
          } catch {}
        });

        if (channel) {
          channel.addEventListener("message", (event) => {
            if (event.data?.type !== "NBO_COVER_IMAGE_REQUEST" || !imagePayload) return;
            channel.postMessage({ type: "NBO_COVER_IMAGE_READY", payload: imagePayload });
          });
        }
      })();
    </script>
  </body>
</html>
