<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff2442" />
    <meta name="description" content="识别真实图片，结合公开趋势联想，生成固定7+8字封面、三平台正文和话题。" />
    <title>NBO 灵感封面｜图片转热门文案</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #faf9f7; }
      .loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; color: #202020; text-align: center; }
      .loading span { color: #8a8580; font-size: 13px; }
      .mark { width: 52px; height: 52px; margin-bottom: 8px; display: grid; place-items: center; color: white; background: #ff2442; border-radius: 16px; font: 800 30px/1 Georgia, serif; box-shadow: 0 10px 26px rgba(255,36,66,.24); }
      .viewport { width: 100%; height: 100%; position: relative; z-index: 1; overflow: hidden; }
      iframe { width: 100%; height: 100%; position: absolute; top: 0; left: 0; border: 0; background: #faf9f7; }
    </style>
  </head>
  <body>
    <div class="loading" aria-hidden="true">
      <div class="mark">N</div>
      <strong>正在进入南铂智能文案</strong>
      <span>请稍候，功能正在加载</span>
    </div>
    <div class="viewport">
      <iframe
        src="https://script.google.com/macros/s/AKfycbwE3jYEnaSh75A-5ft6T-ChSvDnKrLFHvKi8fBvMEHhyRcBgieWcKsuN-3iuuzwQIQ_/exec?nbo_embed=1"
        title="NBO 灵感封面智能文案工具"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  </body>
</html>
